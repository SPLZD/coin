<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STread">
<title>STread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 상단 워드마크 바 + 3탭(거래소/자산/내역) + 코인 상세 전체화면 시트. 단일 다크 테마(블랙&바이올렛) */
:root{
  --bg:#07060b; --bg2:#0c0a13; --surface:#110e1a; --surface2:#171324; --line:#231d36; --line2:#2f2748;
  --fg:#efeaf8; --muted:#8c83a3; --dim:#5d5573;
  --violet:#9b6bff; --violet2:#c4a8ff; --violetdeep:#4b2a9e; --glow:rgba(155,107,255,.18);
  --up:#ff4f6e; --down:#5c8dff; --upbg:rgba(255,79,110,.09); --downbg:rgba(92,141,255,.09);
  --serif:"Cormorant Garamond","Didot","Bodoni 72",Georgia,serif;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,a,input,select{touch-action:manipulation}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20% -20% auto;height:60vh;pointer-events:none;z-index:0;
  background:radial-gradient(60% 60% at 50% 0%,rgba(110,60,230,.22),transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--fg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 상단바 */
.top{position:sticky;top:0;z-index:20;background:rgba(7,6,11,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{display:flex;align-items:center;justify-content:space-between;height:52px}
.mark{font-family:var(--serif);font-style:italic;font-weight:700;font-size:27px;letter-spacing:.01em;background:none;border:0;padding:0;
  background-image:linear-gradient(100deg,#fff 10%,var(--violet2) 55%,var(--violet) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.tright{display:flex;align-items:center;gap:10px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.conn.live i{background:#34d399;box-shadow:0 0 8px #34d399}.conn.sim i{background:var(--violet)}
.adminbtn{border:1px solid var(--violet);background:var(--glow);color:var(--violet2);font-size:11px;font-weight:600;letter-spacing:.08em;padding:4px 9px;border-radius:99px}

main{position:relative;z-index:1;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}

/* 총자산 카드 */
.hero{margin:14px 0 6px}
.hero .card{border:1px solid var(--line2);border-radius:18px;padding:16px 18px;
  background:linear-gradient(140deg,rgba(155,107,255,.16),rgba(17,14,26,.9) 45%,rgba(17,14,26,.95));position:relative;overflow:hidden}
.hero .card::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;
  border:1px solid rgba(196,168,255,.18)}
.hero .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero .big{font-size:26px;font-weight:600;margin-top:4px}
.hero .sub{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted)}
.hero .sub b{font-weight:500}

/* 검색·정렬 */
.tools{display:flex;gap:8px;align-items:center;margin:12px 0 4px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:14px}
.search svg{flex:none;opacity:.6}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 12px;font-size:12px}
.chip.on{border-color:var(--violet);color:var(--fg);background:var(--glow)}

/* 코인 목록 */
.lhead,.crow{display:grid;grid-template-columns:minmax(0,1fr) 98px 64px 58px;gap:8px;align-items:center}
.lhead{font-size:11px;color:var(--dim);padding-top:4px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.lhead span{text-align:right}.lhead span:first-child{text-align:left}
.crow{width:100%;border:0;background:none;text-align:left;padding-top:11px;padding-bottom:11px;border-bottom:1px solid rgba(35,29,54,.6);position:relative}
.crow:active{background:var(--surface)}
.crow .nm{display:flex;align-items:center;gap:6px;min-width:0}
.crow .nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .sy{font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.crow .star{color:var(--violet);font-size:11px}
.crow .pr,.crow .rt,.crow .vl{text-align:right}
.crow .pr{font-size:13.5px;font-weight:500;padding:2px 3px;border-radius:4px;border:1px solid transparent;transition:border-color .25s}
.crow .pr.fu{border-color:var(--up)}.crow .pr.fd{border-color:var(--down)}
.crow .rt{font-size:12.5px}.crow .vl{font-size:11.5px;color:var(--muted);white-space:nowrap}
.empty{color:var(--dim);font-size:13px;padding:22px 0;text-align:center}

/* 하단 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(9,8,14,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{border:0;background:none;color:var(--dim);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--violet2)}

/* 섹션 공통 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.ptitle{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.kv span{display:block;font-size:11.5px;color:var(--muted)}.kv b{display:block;font-size:15px;font-weight:600;margin-top:2px}
.alloc{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:4px}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.hrow:last-child{border-bottom:0}
.hrow .t{color:var(--fg);font-size:14.5px;font-weight:600}.hrow .r{text-align:right}
.hrow .v{color:var(--fg)}
.fine{font-size:9.5px;color:var(--dim);text-align:center;margin:26px 0 6px;letter-spacing:.06em;opacity:.7}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--muted);border-radius:9px;padding:8px 0;font-weight:600;font-size:13px}
.seg button.on{background:var(--surface2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.mini{border:1px solid var(--line2);background:var(--surface2);border-radius:8px;padding:5px 11px;font-size:12px;color:var(--fg)}

/* 상세 화면 */
#detail{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dtop{position:sticky;top:0;z-index:3;background:rgba(7,6,11,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.dtop .in{display:flex;align-items:center;gap:6px;height:52px}
.iconbtn{border:0;background:none;width:36px;height:36px;display:grid;place-items:center;color:var(--fg);border-radius:10px}
.dtitle{flex:1;min-width:0;text-align:center}
.dtitle b{display:block;font-size:15px;font-weight:600}.dtitle span{font-size:11px;color:var(--dim);letter-spacing:.04em}
.favbtn.on svg{fill:var(--violet);stroke:var(--violet)}
.pricehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:14px;padding-bottom:10px}
.pricehead .p{font-size:28px;font-weight:600;line-height:1.1}
.pricehead .c{font-size:13px;margin-top:4px}
.pricehead .hl{font-size:11px;color:var(--muted);text-align:right;line-height:1.7}
.pricehead .hl b{font-weight:500}
.dtabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:2;background:var(--bg)}
.dtabs button{border:0;background:none;color:var(--muted);padding:11px 0;font-weight:600;font-size:13.5px;border-bottom:2px solid transparent}
.dtabs button.on{color:var(--fg);border-bottom-color:var(--violet)}

/* 주문 화면: 왼쪽 호가 + 오른쪽 주문 */
.trade{display:grid;grid-template-columns:42% minmax(0,1fr);gap:10px;padding-top:10px;padding-bottom:20px}
.mob{display:flex;flex-direction:column;gap:1px;min-width:0}
.mob button{border:0;display:flex;justify-content:space-between;align-items:center;padding:5px 6px;font-size:11.5px;position:relative;overflow:hidden;min-width:0;background:none}
.mob .a{background:var(--downbg)}.mob .b{background:var(--upbg)}
.mob button i{position:absolute;top:0;bottom:0;right:0;opacity:.18}
.mob .a i{background:var(--down)}.mob .b i{background:var(--up)}
.mob button span{position:relative}
.mob .q{color:var(--muted);font-size:10.5px}
.mob .cur{outline:1px solid var(--fg);outline-offset:-1px}
.form{display:flex;flex-direction:column;gap:8px;min-width:0}
.sidetabs{display:grid;grid-template-columns:1fr 1fr;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.sidetabs button{border:0;background:var(--surface);color:var(--muted);padding:9px 0;font-weight:700;font-size:13px}
.sidetabs button.on[data-v=buy]{background:var(--up);color:#fff}
.sidetabs button.on[data-v=sell]{background:var(--down);color:#fff}
.typetabs{display:flex;gap:12px;font-size:12.5px;padding:2px 2px}
.typetabs button{border:0;background:none;color:var(--dim);padding:2px 0;font-weight:600}
.typetabs button.on{color:var(--fg)}
.avail{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:6px}
.avail b{color:var(--fg);font-weight:500;text-align:right;overflow-wrap:anywhere}
.fbox{border:1px solid var(--line);border-radius:10px;background:var(--bg2);display:flex;align-items:center;min-width:0}
.fbox:focus-within{border-color:var(--violet)}
.fbox label{font-size:10.5px;color:var(--dim);padding-left:9px;flex:none}
.fbox input{flex:1;min-width:0;border:0;background:none;outline:0;text-align:right;padding:10px 9px;font-family:var(--mono);font-size:13.5px}
.fbox .st{border:0;border-left:1px solid var(--line);background:none;width:30px;align-self:stretch;color:var(--muted);font-size:16px}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pcts button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 0;font-size:11px;color:var(--muted)}
.gobtn{border:0;border-radius:11px;padding:13px 0;font-weight:700;font-size:15px;color:#fff;margin-top:2px}
.gobtn.buy{background:linear-gradient(180deg,#ff6b85,var(--up))}.gobtn.sell{background:linear-gradient(180deg,#7aa2ff,var(--down))}
.feeinfo{font-size:10.5px;color:var(--dim)}
.myorders{padding-bottom:24px}

/* 차트 */
.ivs{display:flex;gap:6px;padding-top:12px}
.ivs button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px}
.ivs button.on{border-color:var(--violet);color:var(--fg);background:var(--glow)}
.chartwrap{position:relative;margin-top:10px}
canvas#cv{width:100%;height:300px;display:block}
.chartinfo{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:12px;padding-bottom:24px}

/* 호가 전체 */
.fob{padding-top:8px;padding-bottom:24px}
.fob .r{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;font-size:12.5px;min-height:30px}
.fob .r>div{padding:0 8px}
.fob .ask .sz,.fob .bid .sz{position:relative}
.fob .ask{background:var(--downbg)}.fob .bid{background:var(--upbg)}
.fob .px{text-align:center;font-weight:500}
.fob .bar{position:absolute;top:4px;bottom:4px;opacity:.28;border-radius:2px}
.fob .ask .bar{right:8px;background:var(--down)}.fob .bid .bar{left:8px;background:var(--up)}
.fob .ask .sz{text-align:right}.fob .bid .sz{text-align:left}
.fob .ask .sz span,.fob .bid .sz span{position:relative}

/* 바텀시트 */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,2,6,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;
  padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:rise .22s ease}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .desc{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.sumrows{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:14px}
.sumrows div{display:flex;justify-content:space-between;font-size:13.5px}.sumrows span{color:var(--muted)}
.btnrow{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.btn{border:1px solid var(--line2);background:var(--surface2);border-radius:12px;padding:13px 0;font-weight:600}
.btn.pri{border:0;background:linear-gradient(180deg,#a97dff,#7c4ff0);color:#fff}
.btn.buy{border:0;background:var(--up);color:#fff}.btn.sell{border:0;background:var(--down);color:#fff}
.pinrow{display:flex;justify-content:center;gap:12px;margin:8px 0 16px}
.pinrow i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--violet);display:block}
.pinrow i.f{background:var(--violet)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:14px 0;font-size:18px;font-family:var(--mono)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:11.5px;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:11px 12px;font-family:var(--mono);font-size:14px;color:var(--fg);outline:0}
.field input:focus,.field select:focus{border-color:var(--violet)}
.qbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.qbtns button{border:1px solid var(--line);background:var(--bg2);border-radius:9px;padding:8px 0;font-size:12px;font-family:var(--mono)}
.asec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.asec h4{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet2);font-weight:600}
.ovlist{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.7}

#toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--surface2);border:1px solid var(--line2);color:var(--fg);padding:11px 16px;border-radius:12px;font-size:13px;max-width:90%;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="in gut">
  <button class="mark" id="mark" aria-label="STread">STread</button>
  <div class="tright">
    <button class="adminbtn" id="adminBtn" hidden>ADMIN</button>
    <span class="conn" id="conn"><i></i><span>연결 중</span></span>
  </div>
</div></header>

<main>
  <!-- 거래소 -->
  <section id="tab-market" class="gut">
    <div class="hero"><div class="card">
      <div class="lbl">Total Assets</div>
      <div class="big num" id="hTotal">-</div>
      <div class="sub"><span>평가손익 <b class="num" id="hPnl">-</b></span><span>수익률 <b class="num" id="hRate">-</b></span></div>
    </div></div>
    <div class="tools"><label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="코인명 / 심볼 검색" autocomplete="off"></label></div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">원화 마켓</button>
      <button class="chip" data-f="fav">관심</button>
      <button class="chip" data-f="own">보유</button>
      <button class="chip" data-s="vol">거래대금순</button>
      <button class="chip" data-s="up">상승률순</button>
      <button class="chip" data-s="down">하락률순</button>
    </div>
    <div class="lhead"><span>코인명</span><span>현재가</span><span>전일대비</span><span>거래대금</span></div>
    <div id="list"></div>
  </section>

  <!-- 자산 -->
  <section id="tab-wallet" class="gut" hidden>
    <div class="hero"><div class="card">
      <div class="lbl">Total Assets</div>
      <div class="big num" id="wTotal">-</div>
      <div class="sub"><span>보유 KRW <b class="num" id="wKrw">-</b></span></div>
    </div></div>
    <div class="panel">
      <div class="grid2">
        <div class="kv"><span>총 매수</span><b class="num" id="wCost">-</b></div>
        <div class="kv"><span>총 평가</span><b class="num" id="wEval">-</b></div>
        <div class="kv"><span>평가손익</span><b class="num" id="wPnl">-</b></div>
        <div class="kv"><span>수익률</span><b class="num" id="wRate">-</b></div>
        <div class="kv"><span>주문가능</span><b class="num" id="wFree">-</b></div>

<script>
(function(){
"use strict";

/* ===== 코인 목록 (업비트 원화마켓 주요 종목) ===== */
var COINS=[
 ["BTC","비트코인",150000000],["ETH","이더리움",5200000],["XRP","엑스알피(리플)",3400],["SOL","솔라나",260000],
 ["DOGE","도지코인",300],["ADA","에이다",1000],["TRX","트론",400],["LINK","체인링크",30000],
 ["AVAX","아발란체",40000],["DOT","폴카닷",8000],["BCH","비트코인캐시",700000],["ETC","이더리움클래식",30000],
 ["SHIB","시바이누",0.02],["SUI","수이",5000],["HBAR","헤데라",350],["XLM","스텔라루멘",500],
 ["NEAR","니어프로토콜",4000],["APT","앱토스",8000],["ATOM","코스모스",7000],["AAVE","에이브",350000]
];
var CODES=COINS.map(function(c){return "KRW-"+c[0]});
var FEE=0.0005, MIN=5000, START=10000000, KEY="coinMock.v1", PIN="7777";
var PALETTE=["#9b6bff","#c4a8ff","#6d3fe0","#e0d2ff","#5a2fb8","#b28cff","#8a5cf5","#3f2391"];
var $=function(id){return document.getElementById(id)};
var NAME={},SYM={};COINS.forEach(function(c){NAME["KRW-"+c[0]]=c[1];SYM["KRW-"+c[0]]=c[0]});

/* ===== 저장 ===== */
function fresh(){return {krw:START,hold:{},orders:[],hist:[],seq:1,fav:["KRW-BTC"],ovr:{}}}
var S=(function(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.krw==="number"){var f=fresh();for(var k in f)if(s[k]==null)s[k]=f[k];return s}}catch(e){}return fresh()})();
var saveT=null;function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},200)}
var ADMIN=false;try{ADMIN=sessionStorage.getItem("st.adm")==="1"}catch(e){}

/* ===== 시세 상태 ===== */
var P={};COINS.forEach(function(c){var code="KRW-"+c[0];P[code]={price:null,prev:null,high:null,low:null,vol:0,real:null,ob:null}});

/* ===== 포맷 ===== */
function tick(p){return p>=2e6?1000:p>=1e6?500:p>=5e5?100:p>=1e5?50:p>=1e4?10:p>=1e3?1:p>=100?0.1:p>=10?0.01:p>=1?0.001:p>=0.1?0.0001:0.00001}
function dec(p){var t=tick(p);return t>=1?0:Math.min(5,Math.round(-Math.log10(t)))}
function fp(p){if(p==null||!isFinite(p))return "-";var d=dec(p);return p.toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d})}
function fpr(v,ref){var d=dec(ref);return v.toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d})}
function fw(n){return Math.round(n).toLocaleString("ko-KR")}
function fq(q){if(!q)return "0";var d=q>=1000?2:q>=1?4:8;return (+q.toFixed(d)).toLocaleString("ko-KR",{maximumFractionDigits:d})}
function fr(r){return (r>0?"+":"")+(r*100).toFixed(2)+"%"}
function fsign(n){return (n>0?"+":"")+fw(n)}
function fvol(v){if(!v)return "-";if(v>=1e8)return Math.round(v/1e8).toLocaleString("ko-KR")+"억";return Math.round(v/1e6).toLocaleString("ko-KR")+"백만"}
function cls(v){return v>0?"up":v<0?"down":"flat"}
function rate(c){return c.prev?(c.price-c.prev)/c.prev:0}
function snap(p){var t=tick(p);return Math.round(p/t)*t}
function num(v){var n=parseFloat(String(v).replace(/,/g,""));return isFinite(n)?n:0}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show")},2300)}

/* ===== 실시간 연결 (업비트 공개 웹소켓) ===== */
var mode="wait",lastMsg=0,ws=null;
function setConn(m){mode=m;var el=$("conn");el.className="conn "+(m==="live"?"live":m==="sim"?"sim":"");el.lastChild.textContent=m==="live"?"Live":m==="sim"?"Sim":"연결 중"}
function connect(){
  try{ws=new WebSocket("wss://api.upbit.com/websocket/v1")}catch(e){goSim();return}
  ws.binaryType="arraybuffer";
  ws.onopen=function(){ws.send(JSON.stringify([{ticket:"st-"+Date.now()},{type:"ticker",codes:CODES},{type:"orderbook",codes:CODES}]))};
  ws.onmessage=function(ev){
    var d;try{d=JSON.parse(typeof ev.data==="string"?ev.data:new TextDecoder("utf-8").decode(ev.data))}catch(e){return}
    lastMsg=Date.now();if(mode!=="live")setConn("live");
    var c=P[d.code];if(!c)return;
    if(d.type==="ticker"){
      c.real=d.trade_price;c.prev=d.prev_closing_price;c.vol=d.acc_trade_price_24h;
      if(!S.ovr[d.code]){c.high=d.high_price;c.low=d.low_price;setPrice(d.code,d.trade_price)}
    }else if(d.type==="orderbook"){c.ob=d.orderbook_units;if(cur===d.code)dirtyDetail=true}
  };
  ws.onclose=function(){ws=null;setTimeout(connect,8000)};
  ws.onerror=function(){try{ws.close()}catch(e){}};
}
function goSim(){
  if(mode==="sim")return;setConn("sim");
  CODES.forEach(function(code,i){var c=P[code];if(c.price==null){var b=COINS[i][2];c.prev=b;c.high=b;c.low=b;c.vol=(i<3?2e11:3e9)*(1+Math.random()*5);setPrice(code,b)}});
}
setInterval(function(){if(mode!=="sim"&&Date.now()-lastMsg>10000)goSim()},3000);

/* 가격 반영(실시간/가상/관리자 공통) */
function setPrice(code,p){
  var c=P[code],old=c.price;c.price=p;
  if(c.prev==null)c.prev=p;
  if(c.high==null||p>c.high)c.high=p;if(c.low==null||p<c.low)c.low=p;
  updCandles(code,p);fillOrders(code,p);
  if(old!=null&&old!==p)flash[code]=p>old?1:-1;
  dirtyList[code]=true;if(cur===code)dirtyDetail=true;dirtyTotals=true;
}

/* 가상 움직임: 연결 실패 시 전체, 관리자 '변동' 설정 시 해당 코인 */
setInterval(function(){
  CODES.forEach(function(code){
    var c=P[code],o=S.ovr[code];if(c.price==null&&!o)return;
    if(o){
      if(o.mode==="drift"){o.p=snap(o.p*(1+(Math.random()-0.5)*0.004+(o.trend||0)/100/40));setPrice(code,o.p)}
      else if(c.price!==o.p)setPrice(code,o.p);
      c.sob=synthOB(o.p);
    }else if(mode==="sim"){setPrice(code,snap(c.price*(1+(Math.random()-0.5)*0.004)));c.vol+=c.vol*Math.random()*1e-5;c.sob=synthOB(c.price)}
  });
  save();
},1500);
function synthOB(p){var t=tick(p),u=[];for(var i=0;i<15;i++)u.push({ask_price:snap(p+t*(i+1)),bid_price:snap(p-t*i),ask_size:Math.random()*(p>1e6?1.5:p>1e4?40:30000),bid_size:Math.random()*(p>1e6?1.5:p>1e4?40:30000)});return u}
function obOf(code){var c=P[code];if(S.ovr[code]||mode==="sim"||!c.ob){if(!c.sob&&c.price!=null)c.sob=synthOB(c.price);return c.sob||null}return c.ob}

/* ===== 캔들 ===== */
var CD={},ivSel="1";
function ivMs(iv){return iv==="D"?864e5:+iv*6e4}
function bucket(t,iv){if(iv==="D"){var k=9*36e5;return Math.floor((t+k)/864e5)*864e5-k}var m=ivMs(iv);return Math.floor(t/m)*m}
function loadCandles(code,iv){
  var key=code+"|"+iv;if(CD[key])return;CD[key]=[];
  var url=iv==="D"?"https://api.upbit.com/v1/candles/days?market="+code+"&count=120":"https://api.upbit.com/v1/candles/minutes/"+iv+"?market="+code+"&count=120";
  fetch(url).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(a){
    if(!Array.isArray(a)||!a.length)throw 0;
    var arr=a.slice().reverse().map(function(k){return {t:Date.parse(k.candle_date_time_utc+"Z"),o:k.opening_price,h:k.high_price,l:k.low_price,c:k.trade_price,v:k.candle_acc_trade_volume}});
    var live=CD[key].filter(function(x){return x.t>arr[arr.length-1].t});CD[key]=arr.concat(live);
    if(S.ovr[code]&&P[code].price!=null)updCandles(code,P[code].price);
    if(cur===code)dirtyDetail=true;
  }).catch(function(){synthCandles(code,iv)});
}
function synthCandles(code,iv){
  var key=code+"|"+iv,p=P[code].price;if(p==null){setTimeout(function(){synthCandles(code,iv)},1500);return}
  var m=ivMs(iv),t=bucket(Date.now(),iv)-m*90,arr=[],v=p*(1+(Math.random()-.5)*.08);
  for(var i=0;i<90;i++){var o=v;v=v*(1+(Math.random()-.5)*(iv==="D"?.05:.006));v+=(p-v)*(i/90)*.15;
    arr.push({t:t,o:o,c:v,h:Math.max(o,v)*(1+Math.random()*.003),l:Math.min(o,v)*(1-Math.random()*.003),v:Math.random()*100});t+=m}
  CD[key]=arr.concat(CD[key]||[]);if(cur===code)dirtyDetail=true;
}
function updCandles(code,p){
  ["1","5","15","60","D"].forEach(function(iv){var arr=CD[code+"|"+iv];if(!arr)return;var b=bucket(Date.now(),iv),l=arr[arr.length-1];
    if(l&&l.t===b){l.c=p;if(p>l.h)l.h=p;if(p<l.l)l.l=p;l.v+=0.01}
    else if(!l||b>l.t){arr.push({t:b,o:l?l.c:p,h:p,l:p,c:p,v:0});if(arr.length>300)arr.shift()}});
}

/* ===== 계좌 ===== */
function H(code){return S.hold[code]||{qty:0,cost:0}}
function lockKrw(){return S.orders.reduce(function(s,o){return s+(o.side==="buy"?o.price*o.qty*(1+FEE):0)},0)}
function lockQty(code){return S.orders.reduce(function(s,o){return s+(o.side==="sell"&&o.code===code?o.qty:0)},0)}
function freeKrw(){return Math.max(0,S.krw-lockKrw())}
function freeQty(code){return Math.max(0,H(code).qty-lockQty(code))}
function pushHist(h){S.hist.unshift(h);if(S.hist.length>200)S.hist.length=200}
function execBuy(code,price,qty){var amt=price*qty,fee=amt*FEE;S.krw-=amt+fee;var h=H(code);h.qty+=qty;h.cost+=amt+fee;S.hold[code]=h;
  pushHist({t:Date.now(),code:code,side:"buy",price:price,qty:qty,amt:amt,fee:fee})}
function execSell(code,price,qty){var h=H(code),amt=price*qty,fee=amt*FEE,cp=h.qty?h.cost*qty/h.qty:0;S.krw+=amt-fee;h.qty-=qty;h.cost-=cp;
  if(h.qty<1e-12)delete S.hold[code];else S.hold[code]=h;pushHist({t:Date.now(),code:code,side:"sell",price:price,qty:qty,amt:amt,fee:fee,pnl:amt-fee-cp})}
function fillOrders(code,p){
  var hit=0;S.orders=S.orders.filter(function(o){if(o.code!==code)return true;
    if(o.side==="buy"&&p<=o.price){execBuy(code,o.price,o.qty);hit++;toast(NAME[code]+" 매수 체결 · "+fp(o.price));return false}
    if(o.side==="sell"&&p>=o.price){execSell(code,o.price,o.qty);hit++;toast(NAME[code]+" 매도 체결 · "+fp(o.price));return false}return true});
  if(hit){save();dirtyWallet=true}
}
function totals(){var ev=0,cost=0;for(var k in S.hold){var h=S.hold[k],p=P[k]&&P[k].price;ev+=h.qty*(p!=null?p:(h.qty?h.cost/h.qty:0));cost+=h.cost}
  return {ev:ev,cost:cost,total:S.krw+ev,pnl:ev-cost,rate:cost?(ev-cost)/cost:0}}

/* ===== 목록 ===== */
var rows={},flash={},dirtyList={},dirtyTotals=true,dirtyDetail=false,dirtyWallet=true,filt="all",sortK="vol",query="";
function buildList(){var box=$("list");CODES.forEach(function(code){
  var b=document.createElement("button");b.className="crow gut";
  b.innerHTML='<div><div class="nm"><b>'+NAME[code]+'</b><span class="star" hidden>★</span></div><div class="sy">'+SYM[code]+'/KRW</div></div><div class="pr num">-</div><div class="rt num">-</div><div class="vl num">-</div>';
  b.onclick=function(){openDetail(code)};rows[code]=b;box.appendChild(b)})}
function renderRow(code){var r=rows[code],c=P[code];if(!r)return;var k=cls(c.price-c.prev);
  var pr=r.children[1];pr.textContent=fp(c.price);pr.className="pr num "+k+(flash[code]?(flash[code]>0?" fu":" fd"):"");
  if(flash[code]){(function(el){setTimeout(function(){el.classList.remove("fu","fd")},350)})(pr);delete flash[code]}
  r.children[2].textContent=c.price==null?"-":fr(rate(c));r.children[2].className="rt num "+k;
  r.children[3].textContent=fvol(c.vol);r.querySelector(".star").hidden=S.fav.indexOf(code)<0}
function arrange(){var list=CODES.filter(function(code){
    if(filt==="fav"&&S.fav.indexOf(code)<0)return false;if(filt==="own"&&!S.hold[code])return false;
    if(query){var q=query.toLowerCase();return NAME[code].indexOf(query)>=0||SYM[code].toLowerCase().indexOf(q)>=0}return true});
  list.sort(function(a,b){var A=P[a],B=P[b];if(sortK==="up")return rate(B)-rate(A);if(sortK==="down")return rate(A)-rate(B);return (B.vol||0)-(A.vol||0)});
  var box=$("list");CODES.forEach(function(c){rows[c].hidden=list.indexOf(c)<0});list.forEach(function(c){box.appendChild(rows[c])});
  var e=$("listEmpty");if(!list.length){if(!e){e=document.createElement("div");e.id="listEmpty";e.className="empty";box.appendChild(e)}
    e.textContent=filt==="fav"?"관심 코인이 없습니다. 코인 화면의 ☆를 눌러 추가하세요.":filt==="own"?"보유 중인 코인이 없습니다.":"검색 결과가 없습니다.";e.hidden=false}else if(e)e.hidden=true}
setInterval(arrange,2500);
$("q").oninput=function(){query=this.value.trim();arrange()};
$("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;
  if(b.dataset.f){filt=b.dataset.f;this.querySelectorAll("[data-f]").forEach(function(x){x.classList.toggle("on",x===b)})}
  if(b.dataset.s){sortK=b.dataset.s;this.querySelectorAll("[data-s]").forEach(function(x){x.classList.toggle("on",x===b)})}arrange()};

/* ===== 총자산 ===== */
function renderTotals(){var t=totals();
  $("hTotal").textContent=fw(t.total)+" KRW";var hp=$("hPnl");hp.textContent=fsign(t.pnl);hp.className="num "+cls(t.pnl);
  var hr=$("hRate");hr.textContent=fr(t.rate);hr.className="num "+cls(t.rate)}

/* ===== 자산 탭 ===== */
function renderWallet(){var t=totals();
  $("wTotal").textContent=fw(t.total)+" KRW";$("wKrw").textContent=fw(S.krw);
  $("wCost").textContent=fw(t.cost);$("wEval").textContent=fw(t.ev);
  var a=$("wPnl");a.textContent=fsign(t.pnl);a.className="num "+cls(t.pnl);var b=$("wRate");b.textContent=fr(t.rate);b.className="num "+cls(t.rate);
  $("wFree").textContent=fw(freeKrw());$("wLock").textContent=fw(lockKrw());
  var parts=[{n:"KRW",v:S.krw}];Object.keys(S.hold).forEach(function(k){var h=S.hold[k],p=P[k].price||0;parts.push({n:SYM[k],v:h.qty*p})});

function drawChart(){var cv=$("cv");if(!cur||$("v-chart").hidden)return;var dpr=window.devicePixelRatio||1,W=cv.clientWidth,Hh=cv.clientHeight;if(!W)return;
  cv.width=W*dpr;cv.height=Hh*dpr;var x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,Hh);

    x.strokeStyle=col;x.beginPath();x.moveTo(Math.round(cx)+.5,Y(k.h));x.lineTo(Math.round(cx)+.5,Y(k.l));x.stroke();
    var y1=Y(Math.max(k.o,k.c)),y2=Y(Math.min(k.o,k.c));x.fillStyle=col;x.fillRect(X(i),y1,cw,Math.max(1,y2-y1));
    if(vmx){x.globalAlpha=.35;var vh=k.v/vmx*(VB-8);x.fillRect(X(i),vy0-vh,cw,vh);x.globalAlpha=1}});
  /* 이동평균(5) */

  var last=vis[vis.length-1],ly=Y(last.c);x.setLineDash([3,3]);x.strokeStyle="#9b6bff";x.beginPath();x.moveTo(L,ly);x.lineTo(W-R+4,ly);x.stroke();x.setLineDash([]);
  x.fillStyle="#9b6bff";x.fillRect(W-R+4,ly-9,R-6,18);x.fillStyle="#fff";x.font='600 10px "IBM Plex Mono", monospace';x.fillText(fp(last.c),W-R+9,ly);

function openAdmin(){var sel=cur||"KRW-BTC";
  var opts=CODES.map(function(c){return '<option value="'+c+'"'+(c===sel?" selected":"")+'>'+NAME[c]+' ('+SYM[c]+')</option>'}).join("");
  sheet('<h3>관리자 모드</h3><p class="desc">여기서 바꾼 내용은 이 기기에서만 적용됩니다.</p>'+
   '<div class="asec" style="border:0;margin:0;padding:0"><h4>시세 조작</h4>'+
   '<div class="field"><label for="aCoin">코인</label><select id="aCoin">'+opts+'</select></div>'+
   '<div class="field"><label for="aPrice">가격 (KRW) · 현재 <span id="aNow" class="num"></span></label><input id="aPrice" inputmode="decimal"></div>'+
   '<div class="qbtns"><button data-pct="-10">-10%</button><button data-pct="-5">-5%</button><button data-pct="5">+5%</button><button data-pct="10">+10%</button></div>'+
   '<div class="field"><label for="aMode">움직임</label><select id="aMode"><option value="fixed">고정 (그 가격에 멈춤)</option><option value="drift">변동 (그 가격에서 출발해 움직임)</option></select></div>'+
   '<div class="field"><label for="aTrend">추세 (변동일 때, %/분 · 예: 2 = 분당 약 +2%)</label><input id="aTrend" inputmode="decimal" value="0"></div>'+
   '<div class="btnrow"><button class="btn" id="aRelease">실시간 복귀</button><button class="btn pri" id="aApply">시세 적용</button></div>'+
   '<div class="ovlist" id="aOvList" style="margin-top:10px"></div></div>'+
   '<div class="asec"><h4>자산 수정</h4><div class="field"><label for="aKrw">보유 KRW</label><input id="aKrw" inputmode="decimal" value="'+Math.round(S.krw)+'"></div>'+
   '<div class="field"><label for="aQty">선택한 코인 보유수량</label><input id="aQty" inputmode="decimal"></div>'+
   '<div class="field"><label for="aAvg">선택한 코인 평균단가 (KRW)</label><input id="aAvg" inputmode="decimal"></div>'+
   '<div class="btnrow"><button class="btn" id="aClearOrders">미체결 전부 취소</button><button class="btn pri" id="aSaveAsset">자산 저장</button></div></div>'+
   '<div class="asec"><button class="btn" id="aExit" style="width:100%">관리자 모드 끄기</button></div>');
  function fill(){var c=$("aCoin").value,h=H(c);$("aNow").textContent=fp(P[c].price);$("aPrice").value=P[c].price!=null?String(P[c].price):"";
    $("aQty").value=h.qty?String(+h.qty.toFixed(8)):"0";$("aAvg").value=h.qty?String(Math.round(h.cost/h.qty*1e4)/1e4):"0";
    var o=S.ovr[c];$("aMode").value=o?o.mode:"fixed";$("aTrend").value=o&&o.trend?o.trend:0;
    var ks=Object.keys(S.ovr);$("aOvList").innerHTML=ks.length?"조작 중: "+ks.map(function(k){return SYM[k]+" "+(S.ovr[k].mode==="fixed"?"고정":"변동")}).join(", "):"조작 중인 코인 없음"}
  fill();$("aCoin").onchange=fill;
  $("scrim").querySelectorAll("[data-pct]").forEach(function(b){b.onclick=function(){var c=$("aCoin").value,p=num($("aPrice").value)||P[c].price;$("aPrice").value=String(snap(p*(1+b.dataset.pct/100)))}});
  $("aApply").onclick=function(){var c=$("aCoin").value,p=num($("aPrice").value);if(!(p>0))return toast("가격을 입력하세요");p=snap(p);
    S.ovr[c]={p:p,mode:$("aMode").value,trend:num($("aTrend").value)};if(P[c].prev==null)P[c].prev=p;
    P[c].high=Math.max(P[c].high||p,p);P[c].low=Math.min(P[c].low||p,p);P[c].sob=synthOB(p);setPrice(c,p);save();fill();toast(NAME[c]+" 시세를 "+fp(p)+"로 바꿨습니다")};
  $("aRelease").onclick=function(){var c=$("aCoin").value;if(!S.ovr[c])return toast("조작 중인 코인이 아닙니다");delete S.ovr[c];
    if(P[c].real!=null&&mode==="live")setPrice(c,P[c].real);save();fill();toast(NAME[c]+" 실시간 시세로 복귀")};
  $("aSaveAsset").onclick=function(){var c=$("aCoin").value,k=num($("aKrw").value),q=num($("aQty").value),a=num($("aAvg").value);
    if(k<0||q<0||a<0)return toast("0 이상으로 입력하세요");S.krw=k;if(q>0)S.hold[c]={qty:q,cost:q*(a||P[c].price||0)};else delete S.hold[c];
    save();dirtyWallet=true;dirtyTotals=true;fill();toast("자산을 저장했습니다")};
  $("aClearOrders").onclick=function(){S.orders=[];save();renderMyOpen();dirtyWallet=true;toast("미체결 주문을 모두 취소했습니다")};
  $("aExit").onclick=function(){ADMIN=false;try{sessionStorage.removeItem("st.adm")}catch(e){}$("adminBtn").hidden=true;closeSheet();toast("관리자 모드를 껐습니다")};
}

/* ===== 화면 갱신 루프 ===== */
setInterval(function(){
  for(var code in dirtyList){renderRow(code)}dirtyList={};
  if(dirtyTotals){renderTotals();dirtyTotals=false;if(tab==="wallet")dirtyWallet=true}
  if(dirtyWallet){if(tab==="wallet")renderWallet();if(tab==="hist")renderHist();if(cur){updForm();renderMyOpen()}dirtyWallet=false}
  if(dirtyDetail&&cur){renderDetail();dirtyDetail=false}
},300);

/* ===== 시작 ===== */
buildList();arrange();renderTotals();$("adminBtn").hidden=!ADMIN;setConn("wait");
CODES.forEach(function(c){var o=S.ovr[c];if(o){P[c].prev=o.p;setPrice(c,o.p);P[c].sob=synthOB(o.p)}});
connect();
})();
</script>
</body>
</html>
